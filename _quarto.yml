project:
  type: book
  output-dir: docs

book:
  title: "Environmental Informatics Using Research Infrastructures and their Data"

  description: "Course text for NAU INF 550"
  site-url: https://nau-ecoinformatics.github.io/INF550-textbook/

  chapters:
    - index.Rmd
    - 01-Pre-Course_Skills.Rmd
    - 02-Introduction_to_NEON.Rmd
    - 03-USA-NPN.Rmd
    - 04-PhenoCam.Rmd
    - 05-Fluxes_and_Inter-operability.Rmd
    - 06-NEON_AOP.Rmd
    - 07-NASA_EOS.Rmd
    - 08-USGS.Rmd
    - 09-InternationalSoilMoistureNetwork.md
    - 10-GEE.Rmd
    - 11-OneHealth_PathogenSurveillance.Rmd
    - 12_Vulcan_EDGAR.Rmd
    - 13-Appendix.Rmd


  repo-url: https://github.com/nau-ecoinformatics/INF550-textbook

  repo-actions:
    - edit
    - issue

format:
  html:
    theme: default
    toc: true
    toc-depth: 2
    number-sections: true
    search: true
    grid:
      body-width: 800px
      sidebar-width: 250px
      margin-width: 200px
      gutter-width: 1.5em

execute:
  freeze: false